<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181c">
<meta name="description" content="Unofficial fan-made Modrinth client for Android. Browse mods, modpacks, plugins, resource packs and shaders.">
<link rel="manifest" href="manifest.json">
<title>Modrinth Android</title>
<style>
:root{--bg:#16181c;--card:#1e2126;--text:#eaeaea;--muted:#8d949e;--accent:#1bd96a;--accent-dark:#06210f;--border:#2c3036;--chip:#262a30}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--border);padding:12px 14px;z-index:5}
.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.title h1{font-size:19px;margin:0;color:var(--accent)}
.title small{color:var(--muted);font-size:11px}
input[type=search]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;outline:none}
input[type=search]:focus{border-color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;background:var(--chip);color:var(--muted);border:1px solid transparent;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-dark);font-weight:600}
.chip:disabled{opacity:.4;cursor:default}
main{padding:12px 14px 40px}
.grid{display:grid;gap:10px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer}
.card:active{opacity:.8}
.icon{width:56px;height:56px;border-radius:10px;background:var(--chip);flex:0 0 56px;object-fit:cover}
.info{min-width:0;flex:1}
.name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{color:var(--muted);font-size:13px;margin:3px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:block;width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent);color:var(--accent-dark);font-weight:700;font-size:15px;text-align:center;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--chip);color:var(--text);font-weight:500}
.status{color:var(--muted);text-align:center;padding:24px 0}
.hidden{display:none!important}
.back{background:none;border:none;color:var(--accent);font-size:15px;padding:6px 0;cursor:pointer}
.hero{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.hero img{width:72px;height:72px;border-radius:14px;background:var(--chip);object-fit:cover}
.hero h2{margin:0;font-size:20px}
.hero p{margin:4px 0 0;color:var(--muted);font-size:13px}
.box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px}
.box h3{margin:0 0 8px;font-size:15px}
.body{white-space:pre-wrap;word-wrap:break-word;color:#cfd3d8;font-size:13px;line-height:1.5;max-height:340px;overflow:auto}

/* Download dialog */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:460px;max-height:86vh;background:var(--card);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.m-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.m-icon{width:40px;height:40px;border-radius:8px;background:var(--chip);object-fit:cover;flex:0 0 40px}
.m-head h3{margin:0;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close{background:var(--chip);border:none;color:var(--text);width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;flex:0 0 32px}
.m-body{padding:14px 16px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:6px 0 2px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.selects{display:flex;gap:8px}
.selects select{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none}
.selects select:focus{border-color:var(--accent)}
.channels{display:flex;gap:6px;flex-wrap:wrap}
.vlist{display:flex;flex-direction:column;gap:10px}
.vrow{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px}
.vname{font-weight:600;font-size:15px;word-break:break-word}
.vsub{color:var(--muted);font-size:12px;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--text)}
.tag.loader{background:#1bd96a1f;color:var(--accent)}
.dlbtn{display:block;width:100%;margin-top:10px;padding:11px;border:none;border-radius:10px;background:var(--accent);color:var(--accent-dark);font-weight:700;font-size:14px;cursor:pointer}
.dlbtn:disabled{opacity:.6}
.dlfile{color:var(--muted);font-size:11px;margin-top:5px;text-align:center;word-break:break-all}
.srv-status{color:var(--muted);font-size:12px;margin-top:8px}
.srv-status.ok{color:var(--text)}
.srv-status .dot{color:var(--accent)}
.srv-actions{display:flex;gap:8px;margin-top:10px}
.srv-actions button{flex:1;padding:9px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:var(--chip);color:var(--text)}
.srv-actions button.danger{color:#f05050}
.field{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;outline:none}
.field:focus{border-color:var(--accent)}
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>Modrinth Android</h1>
    <small>Unofficial fan project</small>
  </div>
  <input id="q" type="search" placeholder="Search mods, plugins, modpacks..." autocomplete="off">
  <div class="tabs" id="types">
    <button class="chip on" data-type="mod">Mods</button>
    <button class="chip" data-type="plugin">Plugins</button>
    <button class="chip" data-type="modpack">Modpacks</button>
    <button class="chip" data-type="resourcepack">Resource packs</button>
    <button class="chip" data-type="shader">Shaders</button>
    <button class="chip" data-type="datapack">Datapacks</button>
    <button class="chip" data-type="servers">Servers</button>
  </div>
</header>

<main>
  <section id="listView">
    <div class="grid" id="results"></div>
    <div class="status" id="status"></div>
    <button class="btn ghost hidden" id="more">Load more</button>
  </section>

  <section id="serversView" class="hidden">
    <div class="box" style="margin-top:0"><h3>Featured servers</h3><div class="vsub">Source: PCGamesN, Minecraft server list 2026. Tap Copy IP, then paste it into Minecraft.</div></div>
    <div class="vlist" id="serverList" style="margin-top:12px"></div>
    <div class="status" id="serverEmpty"></div>
    <button class="btn ghost" id="srvRefresh">Refresh status</button>
  </section>

  <section id="detailView" class="hidden">
    <button class="back" id="back">Back to results</button>
    <div id="detail"></div>
  </section>
</main>

<div class="overlay hidden" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="m-head">
      <img class="m-icon" id="mIcon" alt="" onerror="this.style.visibility='hidden'">
      <h3 id="mTitle"></h3>
      <button class="close" id="closeModal" aria-label="Close">✕</button>
    </div>
    <div class="m-body">
      <button class="btn" id="dlLatest">Download latest</button>
      <div class="divider">Download manually</div>
      <div class="selects">
        <select id="selGame" aria-label="Game version"></select>
        <select id="selLoader" aria-label="Loader"></select>
      </div>
      <div class="channels" id="channels"></div>
      <div class="vlist" id="vlist"></div>
    </div>
  </div>
</div>

<script>
const API = "https://api.modrinth.com/v2";
const PAGE = 20;
const CHANNELS = ["release", "beta", "alpha"];
const LOADER_TYPES = ["mod", "modpack", "plugin"];
const state = { type: "mod", q: "", offset: 0, total: 0, busy: false };
const detail = { project: null, versions: [], channel: "release", visible: [] };
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmt(n) {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(n);
}
function fmtSize(b) {
  b = Number(b) || 0;
  if (b >= 1048576) return (b / 1048576).toFixed(1) + " MB";
  if (b >= 1024) return Math.round(b / 1024) + " KB";
  return b + " B";
}
function chanOf(v) {
  return v.version_type || "release";
}
function primaryFile(v) {
  return (v.files || []).find(f => f.primary) || (v.files || [])[0];
}
async function api(path) {
  const r = await fetch(API + path, { headers: { Accept: "application/json" } });
  if (!r.ok) throw new Error("Request failed (" + r.status + ")");
  return r.json();
}

/* Search */
async function search(reset) {
  if (state.busy || state.type === "servers") return;
  state.busy = true;
  if (reset) {
    state.offset = 0;
    $("results").innerHTML = "";
  }
  $("status").textContent = "Loading...";
  $("more").classList.add("hidden");
  try {
    const params = new URLSearchParams({
      query: state.q,
      facets: JSON.stringify([["project_type:" + state.type]]),
      limit: String(PAGE),
      offset: String(state.offset),
      index: state.q ? "relevance" : "downloads"
    });
    const data = await api("/search?" + params.toString());
    state.total = data.total_hits;
    renderCards(data.hits);
    state.offset += data.hits.length;
    $("status").textContent = state.total ? "" : "No results found.";
    if (state.offset < state.total) $("more").classList.remove("hidden");
  } catch (e) {
    $("status").textContent = "Could not load results. Check your connection.";
  } finally {
    state.busy = false;
  }
}

function renderCards(hits) {
  const html = hits.map(h => `
    <div class="card" data-slug="${esc(h.slug)}">
      <img class="icon" src="${esc(h.icon_url || "")}" alt="" onerror="this.style.visibility='hidden'">
      <div class="info">
        <div class="name">${esc(h.title)}</div>
        <div class="desc">${esc(h.description)}</div>
        <div class="meta">
          <span>⬇ ${fmt(h.downloads)}</span>
          <span>♥ ${fmt(h.follows)}</span>
          <span>${esc(h.author)}</span>
        </div>
      </div>
    </div>`).join("");
  $("results").insertAdjacentHTML("beforeend", html);
}

/* Project page */
async function openProject(slug) {
  closeModal();
  $("listView").classList.add("hidden");
  $("detailView").classList.remove("hidden");
  window.scrollTo(0, 0);
  $("detail").innerHTML = '<div class="status">Loading...</div>';
  try {
    const [p, versions] = await Promise.all([
      api("/project/" + encodeURIComponent(slug)),
      api("/project/" + encodeURIComponent(slug) + "/version")
    ]);
    detail.project = p;
    detail.versions = versions;
    detail.channel = CHANNELS.find(ch => versions.some(v => chanOf(v) === ch)) || "release";
    renderDetail(p);
  } catch (e) {
    $("detail").innerHTML = '<div class="status">Could not load this project.</div>';
  }
}

function renderDetail(p) {
  $("detail").innerHTML = `
    <div class="hero">
      <img src="${esc(p.icon_url || "")}" alt="" onerror="this.style.visibility='hidden'">
      <div>
        <h2>${esc(p.title)}</h2>
        <p>${esc(p.author ? "by " + p.author : "")} · ⬇ ${fmt(p.downloads)} · ♥ ${fmt(p.followers)}</p>
      </div>
    </div>
    <p style="color:var(--muted);margin:0">${esc(p.description)}</p>
    <button class="btn" id="openModal">Download</button>
    <div class="box"><h3>Description</h3><div class="body">${esc((p.body || "").slice(0, 4000))}</div></div>
  `;
}

/* Download dialog */
function openModal() {
  const p = detail.project;
  $("mIcon").src = p.icon_url || "";
  $("mTitle").textContent = "Download " + p.title;

  const games = [];
  const loaders = [];
  detail.versions.forEach(v => {
    (v.game_versions || []).forEach(g => { if (!games.includes(g)) games.push(g); });
    (v.loaders || []).forEach(l => { if (!loaders.includes(l)) loaders.push(l); });
  });
  $("selGame").innerHTML = '<option value="">Any game version</option>' +
    games.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join("");

  const showLoader = LOADER_TYPES.includes(p.project_type);
  $("selLoader").classList.toggle("hidden", !showLoader);
  $("selLoader").innerHTML = '<option value="">Any loader</option>' +
    loaders.map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join("");

  $("selGame").value = "";
  $("selLoader").value = "";
  detail.channel = CHANNELS.find(ch => detail.versions.some(v => chanOf(v) === ch)) || "release";
  renderChannels();
  renderList();
  $("overlay").classList.remove("hidden");
}

function closeModal() {
  $("overlay").classList.add("hidden");
}

function matching() {
  const g = $("selGame").value;
  const l = $("selLoader").value;
  return detail.versions.filter(v =>
    chanOf(v) === detail.channel &&
    (!g || (v.game_versions || []).includes(g)) &&
    (!l || (v.loaders || []).includes(l))
  );
}

function renderChannels() {
  $("channels").innerHTML = CHANNELS.map(ch => {
    const count = detail.versions.filter(v => chanOf(v) === ch).length;
    const label = ch.charAt(0).toUpperCase() + ch.slice(1);
    return `<button class="chip ${ch === detail.channel ? "on" : ""}" data-channel="${ch}" ${count ? "" : "disabled"}>${label} (${count})</button>`;
  }).join("");
}

function renderList() {
  const type = detail.project.project_type;
  const list = matching();
  detail.visible = list.slice(0, 40);
  if (!detail.visible.length) {
    $("vlist").innerHTML = '<div class="vsub">No versions match these choices.</div>';
    return;
  }
  $("vlist").innerHTML = detail.visible.map((v, i) => {
    const file = primaryFile(v);
    const date = v.date_published ? new Date(v.date_published).toLocaleDateString() : "";
    const games = (v.game_versions || []).slice(0, 4).map(g => `<span class="tag">${esc(g)}</span>`).join("");
    const more = (v.game_versions || []).length > 4 ? `<span class="tag">+${v.game_versions.length - 4}</span>` : "";
    const loaders = LOADER_TYPES.includes(type) ? (v.loaders || []).map(l => `<span class="tag loader">${esc(l)}</span>`).join("") : "";
    const btn = file
      ? `<button class="dlbtn dl" data-index="${i}">Download</button><div class="dlfile">${esc(file.filename)} · ${fmtSize(file.size)}</div>`
      : `<div class="vsub">No file available</div>`;
    return `
      <div class="vrow">
        <div class="vname">${esc(v.name || v.version_number)}</div>
        <div class="vsub">${esc(v.version_number)}${date ? " · " + esc(date) : ""} · ⬇ ${fmt(v.downloads)}</div>
        <div class="tags">${loaders}${games}${more}</div>
        ${btn}
      </div>`;
  }).join("");
}

async function downloadFile(b, file) {
  const label = b.textContent;
  b.disabled = true;
  b.textContent = "Downloading...";
  try {
    const r = await fetch(file.url);
    if (!r.ok) throw new Error("bad response");
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = file.filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    b.textContent = "Saved";
  } catch (err) {
    window.open(file.url, "_blank");
    b.textContent = label;
  } finally {
    b.disabled = false;
  }
}

/* Servers (saved on this device, status from mcsrvstat.us) */
const FEATURED = [
  { address: "mc.hypixel.net", edition: "java" },
  { address: "play.mccisland.net", edition: "java" },
  { address: "hub.mc-complex.com", edition: "java" },
  { address: "play.serenitymc.uk", edition: "java" },
  { address: "play.verdux.net", edition: "java" }
];
function loadServers() {
  try { return JSON.parse(localStorage.getItem(SERVER_KEY) || "[]"); } catch (e) { return []; }
}
function saveServers(list) {
  try { localStorage.setItem(SERVER_KEY, JSON.stringify(list)); } catch (e) {}
}
function renderServers() {
  const list = FEATURED;
  $("serverEmpty").textContent = list.length ? "" : "No servers added yet.";
  $("serverList").innerHTML = list.map((s, i) => `
    <div class="vrow">
      <div class="vtop"><span class="vname">${esc(s.address)}</span></div>
      <div class="tags"><span class="tag loader">${s.edition === "bedrock" ? "Bedrock" : "Java"}</span></div>
      <div class="srv-status" id="srv-${i}">Checking...</div>
      <div class="srv-actions">
        <button data-copy="${esc(s.address)}">Copy IP</button>
      </div>
    </div>`).join("");
  list.forEach((s, i) => checkServer(s, $("srv-" + i)));
}
async function checkServer(s, el) {
  if (!el) return;
  try {
    const base = s.edition === "bedrock" ? "https://api.mcsrvstat.us/bedrock/3/" : "https://api.mcsrvstat.us/3/";
    const r = await fetch(base + encodeURI(s.address));
    if (!r.ok) throw new Error("bad");
    const d = await r.json();
    if (d.online) {
      const motd = (d.motd && d.motd.clean && d.motd.clean[0]) || "";
      el.className = "srv-status ok";
      el.innerHTML = `<span class="dot">●</span> Online · ${esc(d.players ? d.players.online : 0)}/${esc(d.players ? d.players.max : "?")} players · ${esc(d.version || "")}` +
        (motd ? `<div>${esc(motd)}</div>` : "");
    } else {
      el.className = "srv-status";
      el.textContent = "Offline";
    }
  } catch (e) {
    el.className = "srv-status";
    el.textContent = "Status unavailable";
  }
}
$("srvRefresh").addEventListener("click", renderServers);
$("serverList").addEventListener("click", e => {
  const cp = e.target.closest("[data-copy]");
  if (cp && navigator.clipboard) navigator.clipboard.writeText(cp.dataset.copy).catch(() => {});
});

/* Routing */
function showList() {
  const srv = state.type === "servers";
  $("listView").classList.toggle("hidden", srv);
  $("serversView").classList.toggle("hidden", !srv);
  $("detailView").classList.add("hidden");
}
function backToList() {
  closeModal();
  showList();
}
function route() {
  const m = location.hash.match(/^#project\/(.+)$/);
  if (m) openProject(decodeURIComponent(m[1]));
  else backToList();
}

/* Events */
let debounce;
$("q").addEventListener("input", e => {
  closeModal();
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    state.q = e.target.value.trim();
    search(true);
  }, 350);
});
$("types").addEventListener("click", e => {
  const b = e.target.closest("[data-type]");
  if (!b) return;
  closeModal();
  if (location.hash) location.hash = "";
  document.querySelectorAll("#types .chip").forEach(c => c.classList.toggle("on", c === b));
  state.type = b.dataset.type;
  showList();
  if (state.type === "servers") renderServers();
  else search(true);
});
$("results").addEventListener("click", e => {
  const card = e.target.closest("[data-slug]");
  if (card) location.hash = "project/" + encodeURIComponent(card.dataset.slug);
});
$("more").addEventListener("click", () => search(false));
$("back").addEventListener("click", () => { location.hash = ""; });
$("detail").addEventListener("click", e => {
  if (e.target.closest("#openModal")) openModal();
});
$("channels").addEventListener("click", e => {
  const b = e.target.closest("[data-channel]");
  if (!b || b.disabled) return;
  detail.channel = b.dataset.channel;
  renderChannels();
  renderList();
});
$("selGame").addEventListener("change", renderList);
$("selLoader").addEventListener("change", renderList);
$("dlLatest").addEventListener("click", () => {
  const first = matching()[0];
  const file = first && primaryFile(first);
  if (file) downloadFile($("dlLatest"), file);
  else $("vlist").innerHTML = '<div class="vsub">No file matches these choices.</div>';
});
$("vlist").addEventListener("click", e => {
  const b = e.target.closest(".dl");
  if (!b) return;
  const v = detail.visible[Number(b.dataset.index)];
  const file = v && primaryFile(v);
  if (file) downloadFile(b, file);
});
$("closeModal").addEventListener("click", closeModal);
$("overlay").addEventListener("click", e => {
  if (e.target === $("overlay")) closeModal();
});
window.addEventListener("hashchange", route);

search(true);
route();
</script>
</body>
</html>
